<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bananapp</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="theme-color" content="#B85C38">

<style>
:root{
  --bg:#FAF7F2;
  --card:#FFFFFF;
  --text:#2F2A26;
  --muted:#7B6D62;
  --border:#E6DDD4;
  --accent:#B85C38;
  --accent2:#D98E5F;
  --danger:#B23A48;
  --green:#409176;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  max-width:760px;
  margin:0 auto;
  padding:18px;
  background:var(--bg);
  color:var(--text);
}
h1{font-size:30px;margin:10px 0 2px}
h3{margin:0 0 12px}
.brand-subtitle{margin-bottom:18px;color:var(--muted);font-size:14px}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 3px 12px rgba(96,58,32,.08);
}
.big{font-size:34px;font-weight:850;margin-top:4px}
.label,.small{color:var(--muted);font-size:13px;line-height:1.45}
input,select,button{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  font-size:16px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid var(--border);
}
input,select{background:var(--card);color:var(--text)}
button{
  cursor:pointer;
  border:none;
  background:var(--accent);
  color:white;
  font-weight:700;
}
button:disabled{opacity:.6;cursor:not-allowed}
.item{border-top:1px solid var(--border);padding:12px 0}
.item:first-child{border-top:none}
.category-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  margin-bottom:12px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(96,58,32,.08);
}
.category-header{
  padding:16px;
  cursor:pointer;
  user-select:none;
}
.category-header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.category-title{font-weight:800;font-size:19px}
.category-balance{
  font-size:25px;
  font-weight:800;
  margin-top:3px;
}
.chevron{
  color:var(--muted);
  font-size:20px;
  line-height:1;
  transition:transform .18s ease;
}
.category-card.open .chevron{transform:rotate(180deg)}
.category-form{
  display:none;
  padding:0 16px 16px;
  border-top:1px solid var(--border);
}
.category-card.open .category-form{display:block}
.form-note{margin:12px 0 4px}
.negative{color:var(--danger)}
.progress{
  height:10px;
  background:rgba(127,127,127,.18);
  border-radius:999px;
  overflow:hidden;
  margin:9px 0 5px;
}
.bar{height:100%;width:0%}
.history-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  margin-bottom:14px;
  box-shadow:0 3px 12px rgba(96,58,32,.08);
  overflow:hidden;
}
.history-header{
  padding:16px;
  cursor:pointer;
  user-select:none;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.history-content{
  display:none;
  padding:0 16px 16px;
  border-top:1px solid var(--border);
}
.history-card.open .history-content{display:block}
.history-card.open .history-chevron{transform:rotate(180deg)}
.history-chevron{
  color:var(--muted);
  font-size:20px;
  transition:transform .18s ease;
}
.history-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}
.delete-btn{
  width:auto;
  flex:0 0 auto;
  font-size:12px;
  padding:7px 10px;
  margin:0;
  background:#F9E7E9;
  color:var(--danger);
  border:1px solid rgba(178,58,72,.22);
}
.pin-screen{display:none}
.pin-card{max-width:380px;margin:40px auto 0}
.pin-input{
  text-align:center;
  letter-spacing:.35em;
  font-size:24px;
}
.pin-error{
  color:var(--danger);
  font-size:13px;
  min-height:18px;
  margin-top:6px;
}
.app-content{display:none}
.logout-row{
  text-align:right;
  margin-top:-8px;
  margin-bottom:12px;
}
.logout-btn{
  width:auto;
  font-size:12px;
  padding:6px 9px;
  background:transparent;
  color:var(--muted);
  border:1px solid var(--border);
}
.sync-note{
  display:none;
  margin-bottom:12px;
  padding:9px 12px;
  border-radius:12px;
  background:#FFF4DE;
  border:1px solid #E8D1A5;
  color:#7A5A22;
  font-size:13px;
}
.pending-badge{
  display:inline-block;
  margin-top:4px;
  padding:3px 7px;
  border-radius:999px;
  background:#FFF4DE;
  border:1px solid #E8D1A5;
  color:#7A5A22;
  font-size:11px;
}
#toast{
  display:none;
  position:fixed;
  bottom:32px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:white;
  padding:16px 22px;
  border-radius:18px;
  z-index:100;
  font-size:17px;
  font-weight:700;
  text-align:center;
  min-width:220px;
  max-width:80%;
  box-shadow:0 8px 24px rgba(0,0,0,.22);
}
</style>
</head>

<body>

<div id="pinScreen" class="pin-screen">
  <div class="pin-card card">
    <h1 style="margin-top:0;">Bananapp</h1>
    <div class="brand-subtitle">by TarTeTaTin</div>

    <div class="label">PIN de acceso</div>
    <input
      type="password"
      inputmode="numeric"
      maxlength="4"
      pattern="[0-9]*"
      id="pinInput"
      class="pin-input"
      placeholder="••••"
      autocomplete="off"
    >
    <button id="pinButton">Entrar</button>
    <div id="pinError" class="pin-error"></div>
    <div class="small">El PIN quedará guardado en este teléfono.</div>
  </div>
</div>

<div id="appContent" class="app-content">

<h1>Bananapp</h1>
<div class="brand-subtitle">by TarTeTaTin</div>

<div id="syncNote" class="sync-note"></div>

<div class="logout-row">
  <button class="logout-btn" id="logoutButton">Olvidar PIN</button>
</div>

<div class="card">
  <div class="label">Período actual</div>
  <div class="small" id="periodoActual">Cargando...</div>
  <br>
  <div class="label">Saldo total compartido</div>
  <div class="big" id="saldoTotal">$0</div>
  <div class="small" id="estado">Cargando datos...</div>
</div>

<div>
  <h3>Categorías</h3>
  <div id="categorias"></div>
</div>

<div class="history-card" id="historyCard">
  <div class="history-header" id="historyHeader">
    <h3 style="margin:0;">Historial</h3>
    <div class="history-chevron">⌄</div>
  </div>
  <div class="history-content">
    <div id="historial"></div>
  </div>
</div>

</div>

<div id="toast">Listo</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxRndn5iSDB_gWX-v5evcBMJeTG6fEIpolJvpfLlRoCAyIbmBS9lZywmMdVWHqQ8lL0/exec";
const PIN_KEY = "bananapp_pin";

const DB_NAME = "bananapp_local";
const DB_VERSION = 1;
const STORE_STATE = "state";
const STORE_OUTBOX = "outbox";

let categorias = [];
let gastos = [];
let categoriaAbierta = null;
let pinActual = localStorage.getItem(PIN_KEY) || "";
let periodoActualTexto = "";
let dbPromise = null;
let sincronizando = false;

function formato(n){
  const signo = n < 0 ? "-" : "";
  return signo + "$" + Math.abs(Math.round(n)).toLocaleString("es-CL");
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
setTimeout(() => t.style.display = "none", 3000);
}

function abrirDB(){
  if(dbPromise) return dbPromise;

  dbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);

    req.onupgradeneeded = () => {
      const db = req.result;

      if(!db.objectStoreNames.contains(STORE_STATE)){
        db.createObjectStore(STORE_STATE);
      }

      if(!db.objectStoreNames.contains(STORE_OUTBOX)){
        db.createObjectStore(STORE_OUTBOX, {keyPath:"id"});
      }
    };

    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });

  return dbPromise;
}

async function dbGet(storeName, key){
  const db = await abrirDB();

  return new Promise((resolve,reject)=>{
    const tx = db.transaction(storeName, "readonly");
    const store = tx.objectStore(storeName);
    const req = store.get(key);

    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(storeName, value, key){
  const db = await abrirDB();

  return new Promise((resolve,reject)=>{
    const tx = db.transaction(storeName, "readwrite");
    const store = tx.objectStore(storeName);

    const req = key === undefined
      ? store.put(value)
      : store.put(value, key);

    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}

async function dbDelete(storeName, key){
  const db = await abrirDB();

  return new Promise((resolve,reject)=>{
    const tx = db.transaction(storeName, "readwrite");
    const store = tx.objectStore(storeName);
    const req = store.delete(key);

    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}

async function dbGetAll(storeName){
  const db = await abrirDB();

  return new Promise((resolve,reject)=>{
    const tx = db.transaction(storeName, "readonly");
    const store = tx.objectStore(storeName);
    const req = store.getAll();

    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function guardarEstadoLocal(){
  await dbPut(STORE_STATE, {
    categorias,
    gastos,
    periodo:periodoActualTexto,
    guardadoEn:new Date().toISOString()
  }, "current");
}

async function cargarEstadoLocal(){
  const local = await dbGet(STORE_STATE, "current");

  if(!local) return false;

  categorias = Array.isArray(local.categorias) ? local.categorias : [];
  gastos = Array.isArray(local.gastos) ? local.gastos : [];
  periodoActualTexto = local.periodo || "Mes actual";

  document.getElementById("periodoActual").textContent = periodoActualTexto;
  render();

  return true;
}

async function cantidadPendientes(){
  const pendientes = await dbGetAll(STORE_OUTBOX);
  return pendientes.length;
}

async function actualizarEstadoConexion(){
  const note = document.getElementById("syncNote");
  if(!note) return;

  const pendientes = await cantidadPendientes();

  if(!navigator.onLine){
    note.style.display = "block";
    note.textContent = pendientes > 0
      ? "Sin conexión · " + pendientes + " gasto" + (pendientes===1?"":"s") + " pendiente" + (pendientes===1?"":"s") + " de sincronizar."
      : "Sin conexión · usando los últimos datos guardados en este teléfono.";
    return;
  }

  if(pendientes > 0){
    note.style.display = "block";
    note.textContent = pendientes + " gasto" + (pendientes===1?"":"s") + " pendiente" + (pendientes===1?"":"s") + " de sincronizar.";
  }else{
    note.style.display = "none";
    note.textContent = "";
  }
}

function mostrarLogin(mensaje=""){
  document.getElementById("appContent").style.display = "none";
  document.getElementById("pinScreen").style.display = "block";
  document.getElementById("pinError").textContent = mensaje;
  document.getElementById("pinInput").value = "";
  setTimeout(() => document.getElementById("pinInput").focus(), 100);
}

function mostrarApp(){
  document.getElementById("pinScreen").style.display = "none";
  document.getElementById("appContent").style.display = "block";
  actualizarEstadoConexion();
}

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb = "cb_" + Date.now() + "_" + Math.random().toString(16).slice(2);
    params.callback = cb;
    const s = document.createElement("script");

    window[cb] = data => {
      resolve(data);
      delete window[cb];
      s.remove();
    };

    s.onerror = () => {
      reject(new Error("No se pudo cargar la información."));
      delete window[cb];
      s.remove();
    };

    s.src = API_URL + "?" + new URLSearchParams(params).toString();
    document.body.appendChild(s);
  });
}

async function postData(data){
  await fetch(API_URL,{
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({
      ...data,
      pin: pinActual
    })
  });
}

async function validarPin(pin){
  try{
    const data = await jsonp({
      action:"data",
      pin
    });

    return data && data.success !== false;
  }catch(e){
    return false;
  }
}

async function entrarConPin(){
  const input = document.getElementById("pinInput");
  const boton = document.getElementById("pinButton");
  const pin = input.value.replace(/\D/g, "");

  if(pin.length !== 4){
    document.getElementById("pinError").textContent =
      "Ingresa un PIN de 4 dígitos.";
    return;
  }

  if(!navigator.onLine){
    document.getElementById("pinError").textContent =
      "Necesitas conexión la primera vez para validar el PIN.";
    return;
  }

  boton.disabled = true;
  boton.textContent = "Comprobando...";

  try{
    const correcto = await validarPin(pin);

    if(!correcto){
      document.getElementById("pinError").textContent = "PIN incorrecto.";
      input.value = "";
      input.focus();
      return;
    }

    pinActual = pin;
    localStorage.setItem(PIN_KEY, pinActual);

    mostrarApp();
    await cargarDatos();
  }finally{
    boton.disabled = false;
    boton.textContent = "Entrar";
  }
}

async function cargarDatos(){
  if(!pinActual){
    mostrarLogin();
    return;
  }

  if(!navigator.onLine){
    const hayLocal = await cargarEstadoLocal();

    document.getElementById("estado").textContent =
      hayLocal ? "Sin conexión · datos locales" : "Sin conexión · sin datos guardados";

    await actualizarEstadoConexion();
    return;
  }

  try{
    document.getElementById("estado").textContent = "Actualizando...";

    const data = await jsonp({
      action:"data",
      pin: pinActual
    });

    if(data && data.success === false){
      localStorage.removeItem(PIN_KEY);
      pinActual = "";
      mostrarLogin("El PIN guardado ya no es válido.");
      return;
    }

    const pendientes = await dbGetAll(STORE_OUTBOX);
    const idsPendientes = new Set(pendientes.map(p => p.id));

    categorias = data.categorias || [];
    gastos = data.gastos || [];
    periodoActualTexto = data.periodo || "Mes actual";

    // Si alguno de los pendientes ya aparece en el servidor,
    // se elimina de la cola.
    for(const g of gastos){
      if(g.id && idsPendientes.has(g.id)){
        await dbDelete(STORE_OUTBOX, g.id);
      }
    }

    // Volvemos a leer la cola porque puede haber cambiado.
    const siguenPendientes = await dbGetAll(STORE_OUTBOX);

    // Los pendientes que todavía no están en servidor se muestran
    // localmente para no desaparecer durante la sincronización.
    for(const p of siguenPendientes){
      if(!gastos.some(g => g.id === p.id)){
        gastos.push({...p, pending:true});
      }
    }

    recalcularCategoriasConGastos();
    document.getElementById("periodoActual").textContent = periodoActualTexto;

    render();
    await guardarEstadoLocal();

    document.getElementById("estado").textContent =
      "Actualizado " + new Date().toLocaleTimeString("es-CL");

    await actualizarEstadoConexion();
  }catch(e){
    const hayLocal = await cargarEstadoLocal();

    document.getElementById("estado").textContent =
      hayLocal ? "Sin conexión · datos locales" : "No se pudieron cargar los datos.";

    await actualizarEstadoConexion();
  }
}

function recalcularCategoriasConGastos(){
  categorias = categorias.map(c => {
    const gastado = gastos
      .filter(g => g.categoria === c.categoria)
      .reduce((total,g) => total + Number(g.monto || 0), 0);

    return {
      ...c,
      gastado,
      saldo:Number(c.presupuesto || 0) - gastado
    };
  });
}

function formatearMontoInput(input){
  const digitos = input.value.replace(/\D/g, "");
  if(!digitos){
    input.value = "";
    return;
  }
  input.value = Number(digitos).toLocaleString("es-CL");
}

function leerMonto(input){
  const limpio = input.value.replace(/\D/g, "");
  return Number(limpio || 0);
}

function slug(texto){
  return encodeURIComponent(texto).replace(/%/g,"_");
}

function generarId(){
  if(window.crypto && crypto.randomUUID){
    return crypto.randomUUID();
  }

  return "bnp-" + Date.now() + "-" + Math.random().toString(16).slice(2);
}

function toggleCategoria(nombre){
  categoriaAbierta = categoriaAbierta === nombre ? null : nombre;
  renderCategorias();

  if(categoriaAbierta){
    setTimeout(() => {
      const campo = document.getElementById("monto-" + slug(nombre));
      if(campo) campo.focus();
    }, 80);
  }
}

async function registrarGastoEnCategoria(nombre){
  const sufijo = slug(nombre);

  const montoInput = document.getElementById("monto-" + sufijo);
  const descripcionInput = document.getElementById("descripcion-" + sufijo);
  const personaSelect = document.getElementById("persona-" + sufijo);
  const boton = document.getElementById("boton-" + sufijo);

  const monto = leerMonto(montoInput);
  const descripcion = descripcionInput.value.trim();
  const persona = personaSelect.value;

  if(!monto || monto <= 0){
    alert("Ingresa un monto válido.");
    montoInput.focus();
    return;
  }

  if(!persona){
    alert("Selecciona quién hizo el gasto.");
    personaSelect.focus();
    return;
  }

  const gasto = {
    id:generarId(),
    fecha:new Date().toISOString(),
    categoria:nombre,
    descripcion,
    monto,
    persona,
    pending:true
  };

  await dbPut(STORE_OUTBOX, gasto);

  gastos.push(gasto);
  recalcularCategoriasConGastos();
  render();
  await guardarEstadoLocal();

  montoInput.value = "";
  descripcionInput.value = "";
  personaSelect.value = "";

  if(navigator.onLine){
    toast("Gasto guardado · sincronizando");
    sincronizarPendientes();
  }else{
    toast("Gasto guardado · pendiente de sincronizar");
  }

  await actualizarEstadoConexion();
}

async function sincronizarPendientes(){
  if(sincronizando || !navigator.onLine || !pinActual) return;

  sincronizando = true;

  try{
    const pendientes = await dbGetAll(STORE_OUTBOX);

    for(const gasto of pendientes){
      try{
        await postData({
          action:"addExpense",
          id:gasto.id,
          categoria:gasto.categoria,
          descripcion:gasto.descripcion || "",
          monto:Number(gasto.monto),
          persona:gasto.persona || ""
        });
      }catch(e){
        break;
      }
    }

    // Como POST es no-cors, verificamos por GET cuáles IDs
    // efectivamente llegaron al servidor.
    await new Promise(resolve => setTimeout(resolve, 700));
    await cargarDatos();

  }finally{
    sincronizando = false;
    await actualizarEstadoConexion();
  }
}

async function eliminarGasto(g){
  // Si todavía no se sincronizó, se puede eliminar localmente
  // incluso sin internet.
  if(g.pending && g.id){
    const confirmarPendiente = confirm(
      "¿Eliminar este gasto pendiente?\n\n" +
      (g.descripcion || "(sin descripción)") + "\n" +
      formato(g.monto)
    );

    if(!confirmarPendiente) return;

    await dbDelete(STORE_OUTBOX, g.id);
    gastos = gastos.filter(x => x.id !== g.id);
    recalcularCategoriasConGastos();
    render();
    await guardarEstadoLocal();
    await actualizarEstadoConexion();
    toast("Gasto pendiente eliminado");
    return;
  }

  if(!navigator.onLine){
    alert("Necesitas conexión para eliminar un gasto ya sincronizado.");
    return;
  }

  const persona = g.persona ? " · " + g.persona : "";
  const descripcion = g.descripcion || "(sin descripción)";

  const confirmar = confirm(
    "¿Eliminar este gasto?\n\n" +
    descripcion + "\n" +
    formato(g.monto) + "\n" +
    g.categoria + persona
  );

  if(!confirmar) return;

  await postData({
    action:"deleteExpense",
    id:g.id || "",
    rowNumber:g.rowNumber,
    categoria:g.categoria,
    descripcion:g.descripcion || "",
    monto:Number(g.monto),
    persona:g.persona || ""
  });

  toast("Gasto eliminado");
  setTimeout(cargarDatos, 900);
}

function render(){
  const saldoTotal = categorias.reduce(
    (a,c) => a + Number(c.saldo || 0),
    0
  );

  const el = document.getElementById("saldoTotal");
  el.textContent = formato(saldoTotal);
  el.className = saldoTotal < 0 ? "big negative" : "big";

  renderCategorias();
  renderHistorial();
}

function renderCategorias(){
  const cont = document.getElementById("categorias");
  cont.innerHTML = "";

  if(categorias.length === 0){
    cont.innerHTML =
      "<div class='card small'>Todavía no hay categorías guardadas en este teléfono.</div>";
    return;
  }

  categorias.forEach(c => {
    const porcentajeReal = c.presupuesto > 0
      ? (c.gastado / c.presupuesto) * 100
      : 0;

    const anchoBarra = Math.min(Math.max(porcentajeReal,0),100);

    let color = "#409176";

    if(porcentajeReal >= 90){
      color = "#B23A48";
    }else if(porcentajeReal >= 75){
      color = "#D98E5F";
    }

    const abierta = categoriaAbierta === c.categoria;
    const sufijo = slug(c.categoria);

    const div = document.createElement("div");
    div.className = "category-card" + (abierta ? " open" : "");

    div.innerHTML = `
      <div class="category-header">
        <div class="category-header-row">
          <div style="width:100%">
            <div class="category-title">${c.categoria}</div>

            <div class="category-balance ${c.saldo<0?"negative":""}">
              ${formato(c.saldo)}
            </div>

            <div class="small">
              Presupuesto: ${formato(c.presupuesto)} · Gastado: ${formato(c.gastado)}
            </div>

            <div class="progress">
              <div class="bar" style="width:${anchoBarra}%;background:${color}"></div>
            </div>

            <div class="small">${Math.round(porcentajeReal)}% usado</div>
          </div>

          <div class="chevron">⌄</div>
        </div>
      </div>

      <div class="category-form">
        <div class="small form-note">
          Registrar gasto en ${c.categoria}
        </div>

        <input
          type="text"
          inputmode="numeric"
          id="monto-${sufijo}"
          placeholder="Monto"
        >

        <input
          type="text"
          id="descripcion-${sufijo}"
          placeholder="Descripción"
        >

        <select id="persona-${sufijo}">
          <option value="">Quién hizo el gasto</option>
          <option value="Fernanda">Fernanda</option>
          <option value="Miguel">Miguel</option>
        </select>

        <button id="boton-${sufijo}">
          Registrar gasto
        </button>
      </div>
    `;

    div.querySelector(".category-header").addEventListener("click", () => {
      toggleCategoria(c.categoria);
    });

    const montoInput = div.querySelector("#monto-" + sufijo);
    montoInput.addEventListener("input", () => {
      formatearMontoInput(montoInput);
    });

    div.querySelector("#boton-" + sufijo).addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      registrarGastoEnCategoria(c.categoria);
    });

    cont.appendChild(div);
  });
}

function renderHistorial(){
  const cont = document.getElementById("historial");
  cont.innerHTML = "";

  if(gastos.length === 0){
    cont.innerHTML =
      "<div class='small'>Todavía no hay gastos registrados este mes.</div>";
    return;
  }

  gastos.slice().sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).forEach(g => {
    const div = document.createElement("div");
    div.className = "item";

    const persona = g.persona ? " · " + g.persona : "";
    const pendiente = g.pending
      ? '<div class="pending-badge">Pendiente de sincronizar</div>'
      : "";

    div.innerHTML = `
      <div class="history-row">
        <div>
          <strong>${g.descripcion || "(sin descripción)"}</strong><br>
          -${formato(g.monto)}<br>
          <span class="small">${g.categoria}${persona}</span><br>
          <span class="small">${new Date(g.fecha).toLocaleString("es-CL")}</span>
          ${pendiente}
        </div>

        <button class="delete-btn">Eliminar</button>
      </div>
    `;

    div.querySelector(".delete-btn").addEventListener("click", () => {
      eliminarGasto(g);
    });

    cont.appendChild(div);
  });
}

document.getElementById("historyHeader").addEventListener("click", () => {
  document.getElementById("historyCard").classList.toggle("open");
});

document.getElementById("pinInput").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0,4);
});

document.getElementById("pinInput").addEventListener("keydown", e => {
  if(e.key === "Enter"){
    entrarConPin();
  }
});

document.getElementById("pinButton").addEventListener("click", entrarConPin);

document.getElementById("logoutButton").addEventListener("click", () => {
  if(!confirm("¿Olvidar el PIN guardado en este teléfono?")) return;

  localStorage.removeItem(PIN_KEY);
  pinActual = "";
  categorias = [];
  gastos = [];
  categoriaAbierta = null;

  mostrarLogin();
});

window.addEventListener("online", async () => {
  await actualizarEstadoConexion();

  if(pinActual){
    await sincronizarPendientes();
  }
});

window.addEventListener("offline", actualizarEstadoConexion);

document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && pinActual && navigator.onLine){
    sincronizarPendientes();
  }
});

async function iniciar(){
  await abrirDB();

  if(!pinActual){
    mostrarLogin();
    return;
  }

  mostrarApp();

  // Muestra la copia local inmediatamente, si existe.
  await cargarEstadoLocal();

  if(navigator.onLine){
    await sincronizarPendientes();
    await cargarDatos();
  }else{
    document.getElementById("estado").textContent = "Sin conexión · datos locales";
    await actualizarEstadoConexion();
  }
}

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./service-worker.js")
      .catch(() => {});
  });
}

iniciar();

setInterval(() => {
  if(pinActual && navigator.onLine){
    sincronizarPendientes();
  }
},30000);
</script>

</body>
</html>
